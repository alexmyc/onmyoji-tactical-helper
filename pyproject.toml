[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onmyoji-tactical-helper"
version = "1.0.0"
description = "Real-Time Computer Vision & Edge-AI Desktop Automation System (YOLOv8n + RapidOCR + Gemma-4 GGUF + XMind Decision Tree)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Alex C." }
]
dependencies = [
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "ultralytics>=8.0.0",
    "rapidocr-onnxruntime>=1.3.0",
    "pygetwindow>=0.0.9",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
llm = [
    "llama-cpp-python>=0.2.70; sys_platform == 'win32'",
]
build = [
    "Cython>=3.0.0",
    "PyInstaller>=6.0.0",
    "setuptools>=65.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.coverage.run]
source = ["onmyoji_helper"]
# Interactive Tkinter windows, Win32 GDI/SendInput syscalls, and CUDA/GGUF runtime loaders
# require a live desktop session / GPU; headless CI enforces >=70% across core CV, decision & domain layers.
omit = [
    "*/ui/*",
    "*/app/*",
    "*/infra/capture_engine.py",
    "*/infra/model_lifecycle.py",
    "*/infra/win32_*.py",
    "*/infra/auth_service.py",
    "*/infra/logger_setup.py",
    "*/infra/paths.py",
    "*/decision/llm_engine.py",
]

[tool.ruff]
target-version = "py312"
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
disable_error_code = ["import-untyped"]
