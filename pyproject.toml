[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onmyoji-tactical-helper"
version = "2.0.0"
description = "Real-Time Multimodal Tactical Decision Support & Desktop Automation Research Platform (YOLOv8n + RapidOCR + Gemma-4 GGUF + XMind Counter-Tree)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Alex C." }
]
dependencies = [
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "ultralytics>=8.0.0",
    "rapidocr-onnxruntime>=1.3.0",
    "pygetwindow>=0.0.9",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
llm = [
    "llama-cpp-python>=0.2.70; sys_platform == 'win32'",
]
build = [
    "Cython>=3.0.0",
    "PyInstaller>=6.0.0",
    "setuptools>=65.0.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
target-version = "py312"
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
ignore_missing_imports = true
check_untyped_defs = true
