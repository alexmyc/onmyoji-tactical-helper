name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

jobs:
  quality-and-tests:
    name: Ruff, Mypy & Pytest Coverage
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install lightweight runtime & dev/QA dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy opencv-python pygetwindow pywin32 -r requirements-dev.txt

      - name: Run Ruff static linter
        run: python -m ruff check src tests scripts run_app.py build_release.py

      - name: Run Mypy static type check
        run: python -m mypy src

      - name: Run offline unit & synthetic regression suite with coverage gate (>= 70%)
        run: python -m pytest -v --cov=onmyoji_helper --cov-report=term-missing --cov-fail-under=70
